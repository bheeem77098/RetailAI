<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RetailAI - Smart Retail Intelligence</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #172033;
        }

        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 20px;
            background: linear-gradient(135deg, #eef3ff, #ffffff);
        }

        .container {
            max-width: 850px;
        }

        .logo {
            font-size: 64px;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 52px;
            margin-bottom: 15px;
        }

        h1 span {
            color: #2563eb;
        }

        .subtitle {
            font-size: 22px;
            line-height: 1.6;
            color: #5b6475;
            margin-bottom: 30px;
        }

        .features {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            margin-bottom: 35px;
        }

        .feature {
            background: white;
            padding: 12px 18px;
            border-radius: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            font-size: 15px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn {
            text-decoration: none;
            padding: 14px 25px;
            border-radius: 8px;
            font-weight: bold;
            display: inline-block;
        }

        .primary {
            background: #2563eb;
            color: white;
        }

        .secondary {
            background: white;
            color: #2563eb;
            border: 2px solid #2563eb;
        }

        .footer {
            margin-top: 40px;
            color: #7a8291;
            font-size: 14px;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 38px;
            }

            .subtitle {
                font-size: 18px;
            }

            .logo {
                font-size: 50px;
            }
        }
    </style>
</head>

<body>

<section class="hero">

    <div class="container">

        <div class="logo">🛒</div>

        <h1>Retail<span>AI</span></h1>

        <p class="subtitle">
            AI-Powered Retail Intelligence Platform
            for smarter and more efficient store management.
        </p>

        <div class="features">
            <div class="feature">👥 Customer Detection</div>
            <div class="feature">📊 Store Analytics</div>
            <div class="feature">📍 Zone Monitoring</div>
            <div class="feature">⏱️ Queue Monitoring</div>
            <div class="feature">🤖 AI Insights</div>
            <div class="feature">🔒 Privacy Focused</div>
        </div>

        <div class="buttons">

            <a class="btn primary"
               href="https://github.com/bheeem77098/RetailAI">
                View Project
            </a>

            <a class="btn secondary"
               href="https://github.com/bheeem77098/RetailAI/tree/main/templates">
                Dashboard Files
            </a>

        </div>

        <div class="footer">
            Built with Python • Flask • YOLO • OpenCV
        </div>

    </div>

</section>

</body>
</html>
